<!--
  Diagram Archetype: Node-Link Graph & Tree Traversal
  Budget Adherence: 7 nodes (max 9), 9 edges (max 12), 1 accent focal link, 2 decision callouts.
  Discipline: 4px grid snap, opaque halo pill labels with fill="var(--surface)", pathLength="100", zero elevation shadows.
  State Classes:
    - .state-idle: Inactive background node/edge
    - .state-candidate: Edge under evaluation (dashed stroke)
    - .state-active: Current traversing edge or focal node (accent hue)
    - .state-committed: Finalized spanning tree edge (solid green/teal)
    - .state-rejected: Dismissed cycle edge with strikethrough badge
-->

<section class="diagram-spec" data-diagram="node-link-graph">
  <div class="diagram-frame">
    <svg class="diagram-svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="nlg-grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--surface-border)" stroke-width="1" stroke-opacity="0.25"/>
        </pattern>
      </defs>

      <rect width="1200" height="675" fill="url(#nlg-grid)" rx="8" />

      <!-- LAYER 1: Inactive Background Edges -->
      <line x1="280" y1="460" x2="560" y2="480" stroke="var(--surface-border)" stroke-width="2" class="state-idle" />
      <line x1="560" y1="480" x2="880" y2="460" stroke="var(--surface-border)" stroke-width="2" class="state-idle" />

      <!-- LAYER 2: Rejected Edge (Cycle detected between A-C-D) -->
      <line x1="280" y1="460" x2="560" y2="200" stroke="var(--state-rejected, #f43f5e)" stroke-width="2" stroke-dasharray="4 4" class="state-rejected" />

      <!-- LAYER 3: Committed Edges (Tree Partitions) -->
      <line x1="280" y1="200" x2="560" y2="200" stroke="var(--state-committed, #34d399)" stroke-width="4" class="state-committed" />
      <line x1="280" y1="200" x2="280" y2="460" stroke="var(--state-committed, #34d399)" stroke-width="4" class="state-committed" />

      <!-- LAYER 4: Candidate Edge Under Evaluation -->
      <line x1="560" y1="200" x2="880" y2="200" stroke="var(--state-candidate, #38bdf8)" stroke-width="3" stroke-dasharray="6 6" class="state-candidate" />

      <!-- LAYER 5: Active Focal Edge (Selected Minimum Link) -->
      <line x1="560" y1="200" x2="560" y2="480" stroke="var(--accent)" stroke-width="5" pathLength="100" class="state-active path-draw" />

      <!-- LAYER 6: Opaque Halo Pills on Edge Weights (Anti-crossing: painted AFTER lines) -->
      <!-- Edge A-B weight -->
      <rect x="390" y="186" width="60" height="28" rx="14" fill="var(--surface)" stroke="var(--surface-border)" stroke-width="1" />
      <text x="420" y="205" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="var(--text-muted)">4 km</text>

      <!-- Edge A-C weight -->
      <rect x="250" y="316" width="60" height="28" rx="14" fill="var(--surface)" stroke="var(--surface-border)" stroke-width="1" />
      <text x="280" y="335" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="var(--text-muted)">5 km</text>

      <!-- Edge B-D Candidate weight -->
      <rect x="690" y="186" width="60" height="28" rx="14" fill="var(--surface)" stroke="var(--state-candidate, #38bdf8)" stroke-width="1.5" />
      <text x="720" y="205" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="var(--state-candidate, #38bdf8)">7 km</text>

      <!-- Edge B-E Active Selected Callout -->
      <rect x="580" y="326" width="160" height="32" rx="16" fill="var(--surface)" stroke="var(--accent)" stroke-width="2" class="callout-pill" />
      <text x="660" y="347" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="var(--accent)">MIN LINK: B-E (3 km)</text>

      <!-- Rejected Cycle Cross Badge -->
      <rect x="380" y="316" width="140" height="28" rx="14" fill="var(--surface)" stroke="var(--state-rejected, #f43f5e)" stroke-width="1" />
      <text x="450" y="335" text-anchor="middle" font-family="var(--font-mono)" font-size="11" font-weight="700" fill="var(--state-rejected, #f43f5e)">CYCLE REJECTED</text>

      <!-- LAYER 7: Nodes with Opaque Fills -->
      <!-- Node A -->
      <g transform="translate(280, 200)">
        <circle r="32" fill="var(--surface)" stroke="var(--state-committed, #34d399)" stroke-width="3" />
        <text text-anchor="middle" dy="7" font-family="var(--font-mono)" font-size="18" font-weight="700" fill="var(--text)">A</text>
      </g>

      <!-- Node B (Cut source) -->
      <g transform="translate(560, 200)">
        <circle r="32" fill="var(--surface)" stroke="var(--state-committed, #34d399)" stroke-width="3" />
        <text text-anchor="middle" dy="7" font-family="var(--font-mono)" font-size="18" font-weight="700" fill="var(--text)">B</text>
      </g>

      <!-- Node C -->
      <g transform="translate(280, 460)">
        <circle r="32" fill="var(--surface)" stroke="var(--state-committed, #34d399)" stroke-width="3" />
        <text text-anchor="middle" dy="7" font-family="var(--font-mono)" font-size="18" font-weight="700" fill="var(--text)">C</text>
      </g>

      <!-- Node D -->
      <g transform="translate(880, 200)">
        <circle r="32" fill="var(--surface)" stroke="var(--state-candidate, #38bdf8)" stroke-width="2" stroke-dasharray="4 4" class="state-candidate" />
        <text text-anchor="middle" dy="7" font-family="var(--font-mono)" font-size="18" font-weight="700" fill="var(--text-muted)">D</text>
      </g>

      <!-- Node E (Active Target) -->
      <g transform="translate(560, 480)">
        <circle class="node-beacon" r="24" fill="none" stroke="var(--accent)" stroke-width="2" />
        <circle r="32" fill="var(--surface)" stroke="var(--accent)" stroke-width="4" />
        <text text-anchor="middle" dy="7" font-family="var(--font-mono)" font-size="18" font-weight="700" fill="var(--accent)">E</text>
      </g>

      <!-- Node F -->
      <g transform="translate(880, 460)">
        <circle r="32" fill="var(--surface)" stroke="var(--surface-border)" stroke-width="2" class="state-idle" />
        <text text-anchor="middle" dy="7" font-family="var(--font-mono)" font-size="18" font-weight="700" fill="var(--text-muted)">F</text>
      </g>
    </svg>
  </div>
</section>

<style>
  .diagram-spec {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .diagram-frame {
    width: 100%;
    max-height: 720px;
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-md, 8px);
    overflow: hidden;
    background: var(--surface);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .diagram-svg {
    display: block;
    max-width: 100%;
    max-height: 720px;
    width: auto;
    height: 100%;
  }
</style>
