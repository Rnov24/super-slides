<!--
  Diagram Archetype: Data Charts (Bar Comparison & Telemetry Trend Curve)
  Budget Adherence: Dual visual panels (Bar + Curve), 1 accent focal curve, explicit calculated deltas, opaque halo pills.
  Discipline: 4px grid snap, viewBox 1200x675, zero elevation shadows, all colors via var(--*).
-->

<section class="diagram-spec" data-diagram="data-charts">
  <div class="diagram-frame">
    <svg class="diagram-svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="dc-grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--surface-border)" stroke-width="1" stroke-opacity="0.25"/>
        </pattern>
      </defs>

      <rect width="1200" height="675" fill="url(#dc-grid)" rx="8" />

      <!-- PANEL 1: Bar Comparison (Left Half 0 to 560) -->
      <g transform="translate(60, 40)">
        <text x="0" y="30" font-family="var(--font-mono)" font-size="13" font-weight="700" letter-spacing="0.1em" fill="var(--accent)" text-transform="uppercase">
          THROUGHPUT COMPARISON (GB/S)
        </text>

        <!-- Base Line -->
        <line x1="0" y1="520" x2="480" y2="520" stroke="var(--surface-border)" stroke-width="2" />

        <!-- Bar 1: Baseline Architecture -->
        <rect x="60" y="320" width="120" height="200" fill="var(--surface-border)" rx="4" />
        <text x="120" y="300" text-anchor="middle" font-family="var(--font-mono)" font-size="24" font-weight="700" fill="var(--text-muted)">84</text>
        <text x="120" y="555" text-anchor="middle" font-family="var(--font-mono)" font-size="13" fill="var(--text-muted)">LEGACY EVENT BUS</text>

        <!-- Bar 2: Modernized Ingress -->
        <rect x="260" y="120" width="120" height="400" fill="var(--accent)" rx="4" class="bar-grow" />
        <text x="320" y="100" text-anchor="middle" font-family="var(--font-mono)" font-size="28" font-weight="700" fill="var(--accent)">240</text>
        <text x="320" y="555" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="var(--text)">ZERO-COPY BUS</text>

        <!-- Delta Callout Badge -->
        <rect x="230" y="40" width="180" height="36" rx="18" fill="var(--surface)" stroke="var(--state-committed, #34d399)" stroke-width="1.5" />
        <text x="320" y="63" text-anchor="middle" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="var(--state-committed, #34d399)">+185% DELTA (+156 GB/s)</text>
      </g>

      <!-- Center Divider Hairline -->
      <line x1="580" y1="40" x2="580" y2="620" stroke="var(--surface-border)" stroke-width="1" />

      <!-- PANEL 2: Latency Trend Curve (Right Half 600 to 1200) -->
      <g transform="translate(640, 40)">
        <text x="0" y="30" font-family="var(--font-mono)" font-size="13" font-weight="700" letter-spacing="0.1em" fill="var(--accent)" text-transform="uppercase">
          P99.9 TAIL LATENCY AT CONCURRENCY LOAD
        </text>

        <!-- Chart Grid Lines -->
        <line x1="60" y1="520" x2="500" y2="520" stroke="var(--surface-border)" stroke-width="1" />
        <line x1="60" y1="400" x2="500" y2="400" stroke="var(--surface-border)" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.5" />
        <line x1="60" y1="280" x2="500" y2="280" stroke="var(--surface-border)" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.5" />
        <line x1="60" y1="160" x2="500" y2="160" stroke="var(--surface-border)" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.5" />

        <!-- Y Axis Labels -->
        <text x="45" y="525" text-anchor="end" font-family="var(--font-mono)" font-size="12" fill="var(--text-muted)">0ms</text>
        <text x="45" y="405" text-anchor="end" font-family="var(--font-mono)" font-size="12" fill="var(--text-muted)">15ms</text>
        <text x="45" y="285" text-anchor="end" font-family="var(--font-mono)" font-size="12" fill="var(--text-muted)">30ms</text>
        <text x="45" y="165" text-anchor="end" font-family="var(--font-mono)" font-size="12" fill="var(--text-muted)">45ms</text>

        <!-- X Axis Labels -->
        <text x="60" y="550" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="var(--text-muted)">10k</text>
        <text x="206" y="550" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="var(--text-muted)">40k</text>
        <text x="353" y="550" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="var(--text-muted)">70k</text>
        <text x="500" y="550" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="var(--text-muted)">100k conns</text>

        <!-- Curve A: Diverging Baseline -->
        <path d="M 60 500 Q 240 480 340 380 T 500 120" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
        <text x="490" y="105" text-anchor="end" font-family="var(--font-mono)" font-size="11" fill="var(--text-muted)">THREAD POOL (SPIKES)</text>

        <!-- Curve B: Flat Sustained Model -->
        <path d="M 60 500 Q 240 495 340 485 T 500 465" fill="none" stroke="var(--accent)" stroke-width="4" pathLength="100" class="path-draw" />

        <!-- Opaque Halo Callout Badge -->
        <rect x="360" y="435" width="140" height="32" rx="16" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5" />
        <text x="430" y="456" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="var(--accent)">3.8ms FLAT</text>
      </g>
    </svg>
  </div>
</section>

<style>
  .diagram-spec {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .diagram-frame {
    width: 100%;
    max-height: 720px;
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-md, 8px);
    overflow: hidden;
    background: var(--surface);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .diagram-svg {
    display: block;
    max-width: 100%;
    max-height: 720px;
    width: auto;
    height: 100%;
  }
</style>
