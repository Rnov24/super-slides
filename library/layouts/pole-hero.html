<!--
  Layout: Pole Hero (Open-Field Opening and Closing)
  Slide Job: Deliver a single bold, declarative thesis across an unboxed canvas with generous breathing room.
  Slots:
    - {{ kicker }}: Short uppercase domain or context badge
    - {{ headline }}: Massive authoritative statement (100px - 130px)
    - {{ sub_thesis }}: Clarifying takeaway paragraph (28px - 34px)
    - {{ proof_anchors }}: Bottom-pinned metric chips and context tags
  Avoid-List:
    - Never wrap the statement in a surface card box or bordered container.
    - Never place bullet lists or secondary paragraphs in the center void.
    - Never omit bottom anchoring: top header + bottom anchors satisfy R-11 content span.
-->

<section class="slide" data-layout="pole-hero" tabindex="-1">
  <div class="pole-hero-stage">
    <div class="pole-hero-header">
      <span class="pole-kicker">INFRASTRUCTURE MODERNIZATION</span>
      <h1 class="pole-statement">Zero-Partition<br>Resilience</h1>
    </div>

    <div class="pole-hero-bottom">
      <div class="pole-divider"></div>
      <div class="pole-sub-row">
        <p class="pole-sub">
          Deterministic cut invariants eliminate catastrophic failure cascades across global edge topologies without human intervention.
        </p>
        <div class="pole-chips">
          <div class="pole-chip">
            <span class="chip-val">99.999%</span>
            <span class="chip-lbl">UPTIME FLOOR</span>
          </div>
          <div class="pole-chip">
            <span class="chip-val">&lt; 4ms</span>
            <span class="chip-lbl">CONVERGENCE</span>
          </div>
        </div>
      </div>
      <div class="deck-footer">
        <span>TOPOLOGY OPTIMIZATION</span>
        <span>01 / 08</span>
      </div>
    </div>
  </div>
</section>

<style>
  [data-layout="pole-hero"] {
    padding: 72px 100px 56px 100px;
    background: var(--bg);
    background-image: var(--bg-gradient);
  }

  .pole-hero-stage {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    width: 100%;
  }

  .pole-hero-header {
    display: flex;
    flex-direction: column;
  }

  .pole-kicker {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 24px;
  }

  .pole-statement {
    font-family: var(--font-display);
    font-size: 120px;
    font-weight: 400;
    line-height: 1.02;
    letter-spacing: -0.03em;
    color: var(--text);
  }

  .pole-hero-bottom {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .pole-divider {
    width: 100%;
    height: 1px;
    background: var(--surface-border);
  }

  .pole-sub-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 64px;
  }

  .pole-sub {
    font-size: 28px;
    line-height: 1.45;
    color: var(--text-muted);
    max-width: 1000px;
  }

  .pole-chips {
    display: flex;
    gap: 24px;
    flex-shrink: 0;
  }

  .pole-chip {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 20px;
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-sm, 4px);
    background: transparent;
  }

  .pole-chip .chip-val {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    line-height: 1;
  }

  .pole-chip .chip-lbl {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  .deck-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
    padding-top: 16px;
    border-top: 1px solid var(--surface-border-subtle, var(--surface-border));
  }
</style>
