<!--
  Layout: Full Diagram (75% Screen Height Dedicated SVG Stage)
  Slide Job: Deliver maximum visual fidelity for deep topological maps, benchmark telemetry curves, and multi-tier architectural schematics.
  Slots:
    - {{ kicker }}: Domain, protocol, or telemetry stream label
    - {{ title }}: Action conclusion headline
    - {{ diagram_stage }}: Full-width 75% screen height inline SVG stage
  Avoid-List:
    - Never cram multiple paragraphs into the header; keep text concise to leave 75% height for the SVG.
    - Never wrap the SVG in a card container with heavy border shadows.
    - Never use tiny unreadable SVG labels; all diagram text must be >= 14px (monospace/primary).
-->

<section class="slide" data-layout="full-diagram" tabindex="-1">
  <div class="full-diagram-stage">
    <div class="full-diagram-header">
      <span class="full-kicker">TELEMETRY BENCHMARKS</span>
      <h2 class="full-title">Tail Latency Remains Deterministic Past 100k Concurrent Connections</h2>
    </div>

    <div class="full-diagram-canvas">
      <svg class="full-svg" viewBox="0 0 1720 680" preserveAspectRatio="xMidYMid meet">
        <defs>
          <pattern id="full-grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--surface-border)" stroke-width="1" stroke-opacity="0.25"/>
          </pattern>
        </defs>

        <rect width="1720" height="680" fill="url(#full-grid)" rx="8" />

        <!-- Axes -->
        <line x1="120" y1="580" x2="1620" y2="580" stroke="var(--surface-border)" stroke-width="2"/>
        <line x1="120" y1="80" x2="120" y2="580" stroke="var(--surface-border)" stroke-width="2"/>

        <!-- Y Axis Ticks and Labels -->
        <text x="100" y="585" text-anchor="end" font-family="var(--font-mono)" font-size="14" fill="var(--text-muted)">0 ms</text>
        <text x="100" y="460" text-anchor="end" font-family="var(--font-mono)" font-size="14" fill="var(--text-muted)">10 ms</text>
        <text x="100" y="340" text-anchor="end" font-family="var(--font-mono)" font-size="14" fill="var(--text-muted)">20 ms</text>
        <text x="100" y="220" text-anchor="end" font-family="var(--font-mono)" font-size="14" fill="var(--text-muted)">30 ms</text>
        <text x="100" y="100" text-anchor="end" font-family="var(--font-mono)" font-size="14" fill="var(--text-muted)">40 ms</text>

        <!-- X Axis Ticks and Labels -->
        <text x="120" y="615" text-anchor="middle" font-family="var(--font-mono)" font-size="14" fill="var(--text-muted)">0</text>
        <text x="495" y="615" text-anchor="middle" font-family="var(--font-mono)" font-size="14" fill="var(--text-muted)">25k</text>
        <text x="870" y="615" text-anchor="middle" font-family="var(--font-mono)" font-size="14" fill="var(--text-muted)">50k</text>
        <text x="1245" y="615" text-anchor="middle" font-family="var(--font-mono)" font-size="14" fill="var(--text-muted)">75k</text>
        <text x="1620" y="615" text-anchor="middle" font-family="var(--font-mono)" font-size="14" fill="var(--text-muted)">100k conns</text>

        <!-- Reference Curve: Legacy RPC (Diverging) -->
        <path d="M 120 560 Q 600 540 1000 420 T 1620 120" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
        <text x="1590" y="105" text-anchor="end" font-family="var(--font-mono)" font-size="13" fill="var(--text-muted)">LEGACY THREAD-POOL (P99 DIVERGES)</text>

        <!-- Active Winning Curve: Zero-Copy Engine (Deterministic) -->
        <path d="M 120 560 Q 600 550 1000 535 T 1620 510" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="100" class="path-draw"/>

        <!-- Callout Halo Pill at P99 Point -->
        <g transform="translate(1420, 480)">
          <rect x="-80" y="-18" width="160" height="36" rx="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
          <text text-anchor="middle" dy="5" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="var(--accent)">P99.9: 4.2ms STABLE</text>
        </g>
      </svg>
    </div>

    <div class="deck-footer">
      <span>EMPIRICAL TELEMETRY BENCHMARK</span>
      <span>07 / 08</span>
    </div>
  </div>
</section>

<style>
  [data-layout="full-diagram"] {
    padding: 64px 100px 52px 100px;
    background: var(--bg);
    background-image: var(--bg-gradient);
  }

  .full-diagram-stage {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    width: 100%;
  }

  .full-diagram-header {
    display: flex;
    flex-direction: column;
  }

  .full-kicker {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .full-title {
    font-family: var(--font-display);
    font-size: 44px;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--text);
    max-width: 1400px;
  }

  .full-diagram-canvas {
    width: 100%;
    height: 720px;
    margin: 16px 0;
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-md, 8px);
    overflow: hidden;
    background: var(--surface);
  }

  .full-svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .deck-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
    padding-top: 12px;
    border-top: 1px solid var(--surface-border-subtle, var(--surface-border));
  }
</style>
