<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation</title>
  <!-- FONTS: inline library/fonts/*.css yang didaftar tema terpilih di sini -->
  <style>
    /* -- Reset -- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* -- Tokens (Theme default) -- */
    :root {
      --bg:             #0a0d12;
      --bg-gradient:    radial-gradient(circle at 70% 20%, #1e2130 0%, #0f1118 55%, #0a0d12 100%);
      --surface:        #121822;
      --surface-border: #252d3d;
      --text:           #f0f6fc;
      --text-muted:     #8b949e;
      --accent:         #FF5722;
      --accent-alt:     #38bdf8;
      --font-display:   'Archivo Black', sans-serif;
      --font-primary:   'Space Grotesk', system-ui, sans-serif;
      --font-code:      "Cascadia Code", "Fira Code", Consolas, monospace;
      --deck-scale:     1;
      --fade-out-ms:    180ms;
      --fade-in-ms:     280ms;
      --stagger-ms:     40ms;
    }

    /* Motion timing presets */
    [data-motion="calm"] {
      --fade-out-ms: 200ms;
      --fade-in-ms: 450ms;
      --stagger-ms: 60ms;
    }
    [data-motion="brisk"] {
      --fade-out-ms: 100ms;
      --fade-in-ms: 240ms;
      --stagger-ms: 25ms;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; font-family: var(--font-primary);
    }
    #deck-viewport {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      overflow: hidden; background: #000;
    }
    #deck-viewport.is-transitioning { pointer-events: none !important; user-select: none !important; }

    .deck-canvas {
      position: relative; width: 1920px; height: 1080px; flex-shrink: 0;
      transform-origin: center center; transform: scale(var(--deck-scale));
      background: var(--bg); background-image: var(--bg-gradient); overflow: hidden;
    }

    /* -- Slide base: crossfade model -- */
    .slide {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 64px 100px;
      color: var(--text);
      background: var(--bg); background-image: var(--bg-gradient);
      opacity: 0; pointer-events: none;
      visibility: hidden; content-visibility: hidden;
      outline: none;
    }
    .slide.slide-current {
      opacity: 1; pointer-events: auto;
      visibility: visible; content-visibility: visible; z-index: 2;
    }
    @media (prefers-reduced-motion: reduce) {
      :root, [data-motion] {
        --fade-out-ms: 0ms !important;
        --fade-in-ms: 0ms !important;
        --stagger-ms: 0ms !important;
      }
      .slide, .slide * { transition-duration: 0.001ms !important; }
    }

    .fragment:not(.revealed) { opacity: 0; transform: translateY(8px); transition: opacity 240ms ease, transform 240ms ease; }
    .fragment.revealed { opacity: 1; transform: none; }

    /* Overview */
    body.overview-mode .deck-canvas { display: grid !important; grid-template-columns: repeat(4, 1fr); gap: 16px; height: auto; padding: 32px; transform: none; width: 100vw; }
    body.overview-mode .slide { position: static !important; opacity: 1 !important; visibility: visible !important; content-visibility: visible !important; width: 100%; height: auto; aspect-ratio: 16/9; cursor: pointer; border: 2px solid var(--surface-border); border-radius: 8px; overflow: hidden; pointer-events: auto !important; }
    body.overview-mode .slide.slide-current { border-color: var(--accent); }

    /* HUD */
    #shortcut-hud {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.72); backdrop-filter: blur(8px); z-index: 100;
    }
    #shortcut-hud.visible { display: flex; }
    #shortcut-hud .hud-panel {
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 16px; padding: 40px 48px; min-width: 480px;
    }
    #shortcut-hud .hud-panel h2 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 28px; }
    #shortcut-hud .hud-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--surface-border); gap: 32px; }
    #shortcut-hud .hud-row:last-child { border-bottom: none; }
    #shortcut-hud .hud-keys { font-family: var(--font-code); font-size: 14px; color: var(--accent); white-space: nowrap; }
    #shortcut-hud .hud-desc { font-size: 15px; color: var(--text-muted); }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* Print */
    @page { size: 1920px 1080px; margin: 0; }
    @media print {
      html, body { overflow: visible !important; height: auto !important; background: #fff !important; }
      #deck-viewport { display: block !important; position: static !important; overflow: visible !important; width: 1920px !important; height: auto !important; background: transparent !important; }
      .deck-canvas { transform: none !important; width: 1920px !important; height: auto !important; position: static !important; overflow: visible !important; }
      .slide {
        display: block !important;
        page-break-after: always !important; break-after: page !important;
        width: 1920px !important; height: 1080px !important;
        position: relative !important; overflow: hidden !important;
        transform: none !important;
        visibility: visible !important; content-visibility: visible !important;
        opacity: 1 !important;
      }
      .fragment { opacity: 1 !important; transform: none !important; visibility: visible !important; }
      #shortcut-hud, #deck-announcer { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="deck-viewport">
    <div class="deck-canvas" id="deck-canvas">
      <!-- SLIDES: Mount component sections here -->
    </div>
  </div>

  <!-- Shortcut HUD -->
  <div id="shortcut-hud" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" aria-hidden="true">
    <div class="hud-panel">
      <h2>Keyboard Shortcuts</h2>
      <div class="hud-row"><span class="hud-keys">ArrowRight / Space / PageDown</span><span class="hud-desc">Next fragment or slide</span></div>
      <div class="hud-row"><span class="hud-keys">ArrowLeft / Backspace / PageUp</span><span class="hud-desc">Previous fragment or slide</span></div>
      <div class="hud-row"><span class="hud-keys">Home</span><span class="hud-desc">Jump to first slide</span></div>
      <div class="hud-row"><span class="hud-keys">End</span><span class="hud-desc">Jump to last slide</span></div>
      <div class="hud-row"><span class="hud-keys">F</span><span class="hud-desc">Toggle fullscreen</span></div>
      <div class="hud-row"><span class="hud-keys">O</span><span class="hud-desc">Toggle slide grid overview</span></div>
      <div class="hud-row"><span class="hud-keys">?</span><span class="hud-desc">Show / hide this panel</span></div>
    </div>
  </div>
  <div id="deck-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script>
    'use strict';
    // DeckEngine: crossfade model
    // Motion: outgoing fades 1 to 0 and scales 1 to 0.985 over --fade-out-ms;
    //         incoming fades 0 to 1 and scales 0.99 to 1.00 over --fade-in-ms;
    //         slide items stagger fade-up 10px, --stagger-ms apart, ease-out.
    // No translate3d or translateX in transition path.
    class DeckEngine {
      constructor() {
        this.viewport    = document.getElementById('deck-viewport');
        this.slides      = Array.from(document.querySelectorAll('.slide'));
        this.announcer   = document.getElementById('deck-announcer');
        this.shortcutHud = document.getElementById('shortcut-hud');
        this.isOverview  = false;
        this.currentIndex   = 0;
        this.targetIndex    = 0;
        this.isTransitioning = false;
        this.safetyTimer    = null;
        this.duration       = this._readMotion().fadeIn;
        this.touch = { startX: 0, startY: 0, startTime: 0 };
        try {
          this.syncChannel = new BroadcastChannel('super-slides-sync');
          this.syncChannel.onmessage = (e) => { if (typeof e.data.index === 'number') this.goTo(e.data.index, false); };
        } catch (_) { this.syncChannel = null; }
        this._init();
      }
      _readMotion() {
        const style = this.viewport ? getComputedStyle(this.viewport) : null;
        const parseMs = (prop, fallback) => {
          if (!style) return fallback;
          const val = style.getPropertyValue(prop).trim();
          if (!val) return fallback;
          const parsed = parseFloat(val);
          return isNaN(parsed) ? fallback : parsed;
        };
        return {
          fadeOut: parseMs('--fade-out-ms', 180),
          fadeIn:  parseMs('--fade-in-ms', 280),
          stagger: parseMs('--stagger-ms', 40),
        };
      }
      _init() {
        this.updateScale();
        window.addEventListener('resize', () => this.updateScale());
        window.addEventListener('keydown', (e) => this._onKey(e), { capture: true });
        if (this.viewport) {
          this.viewport.addEventListener('touchstart', (e) => this._onTouchStart(e), { passive: true });
          this.viewport.addEventListener('touchend',   (e) => this._onTouchEnd(e),   { passive: false });
        }
        this.slides.forEach((slide, idx) => {
          slide.addEventListener('click', () => {
            if (this.isOverview) {
              this._toggleOverview();
              this.goTo(idx);
            }
          });
        });
        if (!this.slides.length) return;
        const hashIdx = parseInt(window.location.hash.replace('#slide-', ''), 10) - 1;
        const startIdx = isNaN(hashIdx) ? 0 : Math.max(0, Math.min(hashIdx, this.slides.length - 1));
        this.slides.forEach(s => { s.classList.remove('slide-current'); });
        this.currentIndex = startIdx; this.targetIndex = startIdx;
        if (this.slides[startIdx]) {
          this.slides[startIdx].classList.add('slide-current');
          this._settle(startIdx, false);
        }
      }
      updateScale() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        document.documentElement.style.setProperty('--deck-scale', scale);
      }
      stepForward() {
        if (!this.slides.length) return;
        const frag = this.slides[this.currentIndex].querySelector('.fragment:not(.revealed)');
        if (frag) { frag.classList.add('revealed'); return; }
        this._navigate(1);
      }
      stepBackward() {
        if (!this.slides.length) return;
        const frags = Array.from(this.slides[this.currentIndex].querySelectorAll('.fragment.revealed'));
        if (frags.length) { frags[frags.length - 1].classList.remove('revealed'); return; }
        this._navigate(-1);
      }
      _navigate(dir) {
        if (!this.slides.length) return;
        const base = this.isTransitioning ? this.targetIndex : this.currentIndex;
        const next = Math.max(0, Math.min(this.slides.length - 1, base + dir));
        this.goTo(next, true);
      }
      goTo(index, broadcast = true) {
        if (index < 0 || index >= this.slides.length) return;
        if (index === this.currentIndex && !this.isTransitioning) return;
        if (this.isTransitioning) { this.targetIndex = index; return; }
        this.targetIndex = index;
        this._executeTransition(this.currentIndex, index, broadcast);
      }
      _executeTransition(fromIdx, toIdx, broadcast) {
        const fromSlide = this.slides[fromIdx];
        const toSlide   = this.slides[toIdx];
        const motion    = this._readMotion();
        this.duration   = motion.fadeIn;
        const cut = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          || fromSlide.dataset.transition === 'cut'
          || toSlide.dataset.transition   === 'cut';
        this.isTransitioning = true;
        this.viewport.classList.add('is-transitioning');
        if (cut) {
          fromSlide.classList.remove('slide-current');
          toSlide.classList.add('slide-current');
          this._staggerChildren(toSlide, motion);
          this._finalize(toIdx, broadcast);
          return;
        }
        // Crossfade outgoing
        fromSlide.style.transition = `opacity ${motion.fadeOut}ms ease-out, transform ${motion.fadeOut}ms ease-out`;
        fromSlide.style.opacity    = '0';
        fromSlide.style.transform  = 'scale(0.985)';
        // Prepare incoming
        toSlide.style.opacity   = '0';
        toSlide.style.transform = 'scale(0.99)';
        toSlide.style.transition = 'none';
        toSlide.classList.add('slide-current');
        toSlide.getBoundingClientRect();
        // Animate incoming
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            toSlide.style.transition = `opacity ${motion.fadeIn}ms ease-out, transform ${motion.fadeIn}ms ease-out`;
            toSlide.style.opacity   = '1';
            toSlide.style.transform = 'scale(1)';
            this._staggerChildren(toSlide, motion);
          });
        });
        let resolved = false;
        const done = () => {
          if (resolved) return;
          resolved = true;
          clearTimeout(this.safetyTimer);
          toSlide.removeEventListener('transitionend', done);
          this._cleanupTransition(fromSlide, toSlide);
          this._finalize(toIdx, broadcast);
        };
        toSlide.addEventListener('transitionend', done, { once: true });
        this.safetyTimer = setTimeout(done, this.duration + 40); // safety timer
      }
      _staggerChildren(slide, motion = this._readMotion()) {
        const items = Array.from(slide.querySelectorAll('.stagger-item')).filter(el =>
          !el.closest('.deck-footer') &&
          !el.classList.contains('deck-footer') &&
          !el.closest('.locked-stage') &&
          !el.classList.contains('locked-stage') &&
          !el.classList.contains('fragment')
        );
        if (!items.length) return;
        items.forEach((el, i) => {
          el.style.transition = 'none';
          el.style.opacity    = '0';
          el.style.transform  = 'translateY(10px)';
          el.getBoundingClientRect();
          setTimeout(() => {
            el.style.transition = `opacity ${motion.fadeIn}ms ease-out, transform ${motion.fadeIn}ms ease-out`;
            el.style.opacity    = '1';
            el.style.transform  = 'translateY(0)';
          }, i * motion.stagger);
        });
      }
      _cleanupTransition(fromSlide, toSlide) {
        fromSlide.classList.remove('slide-current');
        fromSlide.style.opacity = ''; fromSlide.style.transform = ''; fromSlide.style.transition = '';
        toSlide.style.opacity   = ''; toSlide.style.transform   = ''; toSlide.style.transition   = '';
        toSlide.querySelectorAll('.stagger-item').forEach(el => {
          el.style.opacity = ''; el.style.transform = ''; el.style.transition = '';
        });
        this.viewport.classList.remove('is-transitioning');
      }
      _finalize(finalIdx, broadcast) {
        this.currentIndex    = finalIdx;
        this.isTransitioning = false;
        this.viewport.classList.remove('is-transitioning');
        this._settle(finalIdx, broadcast);
        if (this.targetIndex !== this.currentIndex) {
          const next = this.targetIndex;
          this.targetIndex = this.currentIndex;
          this.goTo(next, broadcast);
        }
      }
      _settle(index, broadcast) {
        window.location.hash = `#slide-${index + 1}`;
        if (this.announcer) this.announcer.textContent = `Slide ${index + 1} of ${this.slides.length}`;
        if (this.slides[index]) this.slides[index].focus({ preventScroll: true });
        if (broadcast && this.syncChannel) this.syncChannel.postMessage({ index });
      }
      _onKey(e) {
        if (e.target.closest('input, textarea, [contenteditable]')) return;
        switch (e.key) {
          case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); this.stepForward(); break;
          case 'ArrowLeft': case 'Backspace': case 'PageUp': e.preventDefault(); this.stepBackward(); break;
          case 'Home': e.preventDefault(); this.goTo(0); break;
          case 'End': e.preventDefault(); this.goTo(this.slides.length - 1); break;
          case 'f': case 'F': this._toggleFullscreen(); break;
          case 'o': case 'O': this._toggleOverview(); break;
          case '?': e.preventDefault(); this._toggleShortcutHud(); break;
        }
      }
      _onTouchStart(e) {
        if (e.target.closest('[data-prevent-slide-swipe]')) return;
        const t = e.changedTouches[0];
        this.touch = { startX: t.clientX, startY: t.clientY, startTime: Date.now() };
      }
      _onTouchEnd(e) {
        if (e.target.closest('[data-prevent-slide-swipe]')) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - this.touch.startX;
        const dy = t.clientY - this.touch.startY;
        const dt = Date.now() - this.touch.startTime;
        if (dt <= 300 && Math.abs(dx) > 40 && Math.abs(dx) > 1.5 * Math.abs(dy)) {
          dx < 0 ? this._navigate(1) : this._navigate(-1);
        }
      }
      _toggleFullscreen() {
        if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(() => {}); }
        else { document.exitFullscreen().catch(() => {}); }
      }
      _toggleOverview() {
        this.isOverview = !this.isOverview;
        document.body.classList.toggle('overview-mode', this.isOverview);
      }
      _toggleShortcutHud() {
        if (!this.shortcutHud) return;
        const visible = this.shortcutHud.classList.toggle('visible');
        this.shortcutHud.setAttribute('aria-hidden', String(!visible));
      }
    }
    document.addEventListener('DOMContentLoaded', () => { window.deck = new DeckEngine(); });
  </script>
</body>
</html>
